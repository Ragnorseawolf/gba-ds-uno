# GBA DS — Moto G edition: phone defaults (motog overlay).
#
# On the phone this file belongs in the GBA DS data folder as
# "gba-ds.cfg" (next to gba-ds.log — the folder the app's file picker
# created for ROMs/states). It is re-read at every launch. Any value the
# in-game settings screen saves later is kept alongside these.
#
# Patch 0001 also compiles these same values in as the Android defaults,
# so this file mainly matters for a phone that already has a gba-ds.cfg
# with different values (an existing file's settings beat compiled
# defaults for the keys it contains).
# EXCEPTION (patches 0005/0006): layout and map are pinned in the
# binary AFTER every config file has loaded, so no file — this one
# included — can change them any more. The two lines below are
# documentation now; they match what the binary enforces.

# Both screens inside the phone's one window, stacked like a real DS
# (the phone is held portrait): the game on the top half, the second
# screen (live map) on the bottom half.
layout = span-v
# The live map / shadow core ON: a second mGBA core emulated just to
# draw the map. This is the big speed cost on a mid-range phone SoC —
# accepted on purpose: the map screen is the point of this build.
# (Only the ~40 games with a full map profile draw a live map; the
# logo-only profiles show their logo there; other games leave the
# bottom half black.)
map = 1
# List every .gba found, not only the ~51 games with map profiles.
show_all = 1
# No display shader: the GPU cost isn't worth it on this panel.
shader = off
# Rewind keeps a ring of savestates: RAM and CPU a phone run doesn't need.
rewind = 0
# Never offer upstream's update APK: it is signed with upstream's key and
# cannot install over this build anyway.
update_check = 0
# On-screen touch gamepad (patch 0002): auto = shown until a physical
# gamepad is used, back on the next screen touch. on/off also work.
touch_controls = auto
